<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Morgan - Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            /* لێرەدا دەتوانیت لینکی باکگراوندی وێنەکەت بگۆڕیت */
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            backdrop-filter: blur(5px);
        }

        .card {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }

        .username {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .bio-info {
            font-size: 13px;
            color: #b3b3b3;
            margin-bottom: 20px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .social-icons a {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-icons a:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- وێنەی پرۆفایل -->
        <div class="avatar-container">
            <img src="https://i.imgur.com/7k12EPG.png" alt="Avatar">
        </div>

        <!-- ناوی بەکارهێنەر -->
        <div class="username">! David MorG4n</div>
        <div class="bio-info">💼 Developer | 📍 Slemani</div>

        <!-- سۆشیال میدیا و بەستەرەکان -->
        <div class="social-icons">
            <a href="https://discord.com" target="_blank">💬</a>
            <a href="https://youtube.com" target="_blank">▶</a>
            <a href="https://spotify.com" target="_blank">🎵</a>
            <a href="https://tiktok.com" target="_blank">📱</a>
        </div>
    </div>

</body>
</html>
