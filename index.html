<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یاری تاوەری دار</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            font-family: Tahoma, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            user-select: none;
        }

        #score {
            position: absolute;
            top: 20px;
            font-size: 36px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }

        canvas {
            background: #162447;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 10px;
            cursor: pointer;
        }

        #game-over {
            display: none;
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 20;
        }

        #game-over h2 {
            margin-top: 0;
            color: #ff4757;
            font-size: 28px;
        }

        #game-over button {
            background: #2ed573;
            border: none;
            padding: 12px 25px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }

        #game-over button:hover {
            background: #26af5f;
        }
    </style>
</head>
<body>

    <div id="score">0</div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <div id="game-over">
        <h2>یاریەکە تەواو بوو!</h2>
        <p id="final-score">نمرەکەت: 0</p>
        <button onclick="restartGame()">دوبارە یاری کردن</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let gameRunning = true;
        let cameraY = 0;
        let targetCameraY = 0;

        // ڕەنگی بۆکسەکان (دار)
        const woodColor1 = "#c87d55";
        const woodColor2 = "#a0522d";
        const woodDarkBorder = "#6d3b1e";

        class Block {
            constructor(x, y, width, height, speed) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.speed = speed;
                this.landed = false;
            }

            draw() {
                ctx.fillStyle = woodColor2;
                ctx.fillRect(this.x, this.y - cameraY, this.width, this.height);

                ctx.fillStyle = woodColor1;
                ctx.fillRect(this.x + 4, this.y - cameraY + 4, this.width - 8, this.height - 8);

                ctx.strokeStyle = woodDarkBorder;
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y - cameraY, this.width, this.height);
            }

            update() {
                if (!this.landed) {
                    this.x += this.speed;
                    if (this.x <= 0 || this.x + this.width >= canvas.width) {
                        this.speed = -this.speed;
                    }
                }
            }
        }

        let blocks = [];
        let currentBlock;

        function startGame() {
            blocks = [];
            score = 0;
            cameraY = 0;
            targetCameraY = 0;
            document.getElementById("score").innerText = score;
            document.getElementById("game-over").style.display = "none";

            gameRunning = true;

            // بنکەی سەرەکی (درێژتر و پانایی کەمتر: پانی 220 و بەرزی 30)
            let baseBlock = new Block(canvas.width / 2 - 110, canvas.height - 60, 220, 30, 0);
            baseBlock.landed = true;
            blocks.push(baseBlock);

            addNewBlock();
        }

        function addNewBlock() {
            let lastBlock = blocks[blocks.length - 1];
            let newY = lastBlock.y - 32; // مەودای نێوان نهۆمەکان گونجێنراوە لەگەڵ بەرزی بۆکسەکە
            let speed = 3.5 + Math.floor(score / 4); 
            if (Math.random() > 0.5) speed = -speed;
            
            // قیاسی نوێ: پانی 220 و بەرزی 30
            currentBlock = new Block(0, newY, 220, 30, speed);
        }

        // کۆنترۆڵکردنی کلیک کردن یان لەمسکردن (Touch/Click)
        window.addEventListener("pointerdown", (e) => {
            // ڕێگری لە کارکردنی دومەڵی ڕیکستارت کاتێک لەسەر بۆتنەکە کلیک دەکرێت
            if (e.target.tagName === 'BUTTON') return;
            
            if (!gameRunning) return;

            if (currentBlock && !currentBlock.landed) {
                currentBlock.landed = true;
                
                let lastBlock = blocks[blocks.length - 1];
                
                let overlapStart = Math.max(currentBlock.x, lastBlock.x);
                let overlapEnd = Math.min(currentBlock.x + currentBlock.width, lastBlock.x + lastBlock.width);
                let overlapWidth = overlapEnd - overlapStart;

                if (overlapWidth <= 0) {
                    gameRunning = false;
                    document.getElementById("final-score").innerText = "نمرەکەت: " + score;
                    document.getElementById("game-over").style.display = "block";
                } else {
                    currentBlock.x = overlapStart;
                    currentBlock.width = overlapWidth;
                    
                    blocks.push(currentBlock);
                    score++;
                    document.getElementById("score").innerText = score;

                    if (blocks.length > 7) {
                        targetCameraY += 32;
                    }

                    addNewBlock();
                }
            }
        });

        function restartGame() {
            startGame();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            cameraY += (targetCameraY - cameraY) * 0.1;

            for (let block of blocks) {
                block.draw();
            }

            if (currentBlock && gameRunning) {
                currentBlock.update();
                currentBlock.draw();
            }

            requestAnimationFrame(gameLoop);
        }

        startGame();
        gameLoop();
    </script>

</body>
</html>
