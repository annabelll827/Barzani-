<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>یاری تاوەری دار</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            font-family: Tahoma, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        #score {
            position: absolute;
            top: 25px;
            font-size: 42px;
            font-weight: bold;
            color: #fbbf24;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
            z-index: 10;
        }

        canvas {
            background: #1e293b;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border-radius: 12px;
            touch-action: none;
        }

        #game-over {
            display: none;
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 2px solid #334155;
            z-index: 20;
        }

        #game-over h2 {
            margin-top: 0;
            color: #f87171;
            font-size: 30px;
        }

        #game-over p {
            font-size: 20px;
            color: #e2e8f0;
        }

        #game-over button {
            background: #22c55e;
            border: none;
            padding: 14px 28px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }

        #game-over button:hover {
            background: #16a34a;
        }
    </style>
</head>
<body>

    <div id="score">0</div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <div id="game-over">
        <h2>یاریەکە تەواو بوو!</h2>
        <p id="final-score">نمرەکەت: 0</p>
        <button id="restart-btn">دوبارە یاری کردن</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let gameRunning = true;
        let cameraY = 0;
        let targetCameraY = 0;

        // ڕەنگەکانی تایبەت بە داری سندوقی ناو وێنەکە (دارێکی کاڵی جوانی گەرم)
        const woodBg = "#d4a373";
        const woodInner = "#e9edc9";
        const woodEdge = "#bc6c25";
        const plankLine = "#dda15e";

        class Block {
            constructor(x, y, width, height, speed) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.speed = speed;
                this.landed = false;
            }

            draw() {
                let renderY = this.y - cameraY;

                // چوارچێوەی دەرەوەی دارەکە
                ctx.fillStyle = woodBg;
                ctx.fillRect(this.x, renderY, this.width, this.height);

                // ناوەوەی دارەکە
                ctx.fillStyle = woodInner;
                ctx.fillRect(this.x + 4, renderY + 4, this.width - 8, this.height - 8);

                // هێڵە ستوونییەکانی دار (هاوشێوەی وێنەی سندوقەکە)
                ctx.fillStyle = plankLine;
                for (let px = this.x + 16; px < this.x + this.width - 12; px += 20) {
                    ctx.fillRect(px, renderY + 5, 2, this.height - 10);
                }

                // قەراغی قایم و سەرنجڕاکێش
                ctx.strokeStyle = woodEdge;
                ctx.lineWidth = 2.5;
                ctx.strokeRect(this.x, renderY, this.width, this.height);

                // چوارچێوەی سەرەوە و خوارەوەی دارەکە (بەندی قەراغ)
                ctx.fillStyle = woodEdge;
                ctx.fillRect(this.x, renderY, this.width, 4);
                ctx.fillRect(this.x, renderY + this.height - 4, this.width, 4);
            }
